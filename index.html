<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Francisco Ferreira</title>
  <link rel="icon" href="img/FF_logo.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <a class="logo" href="about.html"><img src="img/FF_logo.png" alt="Francisco Ferreira — about"></a>

  <div class="links">
    <a class="projects-link" href="projects.html"><img src="img/projects.png" alt="Projects"></a>
    <a class="play-link" href="play.html"><img src="img/letsplay.png" alt="Let's play"></a>
  </div>

  <nav class="row socials" aria-label="Social">
    <a href="https://www.linkedin.com/in/francisco-fernandes-ferreira-9a883932b/" target="_blank" rel="noopener"><img src="img/linkedin.png" alt="LinkedIn"></a>
    <a href="https://github.com/franciscomdlferreira" target="_blank" rel="noopener"><img src="img/github.png" alt="GitHub"></a>
    <a href="https://x.com/1of1francisco" target="_blank" rel="noopener"><img src="img/X.png" alt="X"></a>
  </nav>

  <script>
    // on touch screens there's no hover, so flash the glow before going to About
    (function () {
      var logo = document.querySelector(".logo");
      var touch = window.matchMedia("(hover: none)").matches;
      var still = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (!logo || !touch || still) return;
      logo.addEventListener("click", function (e) {
        e.preventDefault();
        logo.classList.add("tapped");
        setTimeout(function () { window.location.href = logo.href; }, 450);
      });
      // coming back with the browser's back button: remove the glow
      window.addEventListener("pageshow", function () { logo.classList.remove("tapped"); });
    })();
  </script>
</body>
</html>
