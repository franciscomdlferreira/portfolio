<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Function golf (easy) — Francisco Ferreira</title>
  <link rel="icon" href="img/FF_logo.png">
  <link rel="stylesheet" href="styles.css">
  <style>
    body { display: block; padding: 0; overflow: hidden; }

    #course {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
    }
    .home { z-index: 2; }

    .score {
      position: fixed;
      top: 26px;
      right: 24px;
      font-size: 13px;
      color: #888;
      font-variant-numeric: tabular-nums;
      text-align: right;
      line-height: 1.6;
    }
    .score b { color: #111; font-weight: 600; }

    .panel {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      width: min(460px, calc(100vw - 32px));
      text-align: center;
    }

    .formula {
      font-family: "Times New Roman", Georgia, serif;
      font-style: italic;
      font-size: 24px;
      color: #111;
      margin-bottom: 10px;
    }
    .formula .v { color: #16b05a; font-style: normal; }

    .sliders { display: grid; gap: 6px; }
    .sl {
      display: grid;
      grid-template-columns: 20px 1fr 52px;
      align-items: center;
      gap: 12px;
      font-family: "Times New Roman", Georgia, serif;
      font-style: italic;
      font-size: 18px;
    }
    .sl output {
      font: 14px ui-monospace, Menlo, monospace;
      color: #111;
      text-align: right;
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 2px;
      background: #e5e5e5;
      outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #16b05a;
      cursor: pointer;
    }
    input[type="range"]::-moz-range-thumb {
      width: 18px;
      height: 18px;
      border: 0;
      border-radius: 50%;
      background: #16b05a;
      cursor: pointer;
    }

    .checks {
      display: flex;
      justify-content: center;
      gap: 18px;
      margin-top: 12px;
      font-size: 13px;
      color: #bbb;
    }
    .checks .ok { color: #16b05a; }

    .actions { margin-top: 12px; }
    .btn {
      border: 0;
      background: #16b05a;
      color: #fff;
      font: 600 14px -apple-system, BlinkMacSystemFont, sans-serif;
      padding: 9px 22px;
      border-radius: 999px;
      cursor: pointer;
    }
    .btn:disabled { opacity: .4; cursor: default; }
    .next { display: none; }
    .next.on { display: inline-block; }

    .msg {
      min-height: 22px;
      margin-top: 10px;
      font-size: 14px;
      color: #888;
    }
    .msg.bad { color: #c0392b; }
    .msg.good { color: #16b05a; font-weight: 600; }

    .shake { animation: shake .35s; }
    @keyframes shake {
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }
  </style>
</head>
<body>

  <a class="home" href="index.html"><img src="img/FF_logo.png" alt="Home"></a>

  <canvas id="course" aria-label="Golf course"></canvas>

  <div class="score" id="score"></div>

  <div class="panel" id="panel">
    <div class="formula" id="formula"></div>
    <div class="sliders" id="sliders"></div>
    <div class="checks">
      <span id="chkBall">○ touches the ball</span>
      <span id="chkFlag">○ reaches the flag</span>
    </div>
    <div class="actions">
      <button class="btn" id="go" type="button">swing</button>
      <button class="btn next" id="next" type="button">next hole →</button>
    </div>
    <div class="msg" id="msg"></div>
  </div>

  <script src="play.js"></script>
</body>
</html>
